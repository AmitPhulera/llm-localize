name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Each job asks for what it needs
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each supported Django line, on the oldest and newest Python it supports
        include:
          - { django: "4.2", python: "3.10" }
          - { django: "4.2", python: "3.12" }
          - { django: "5.0", python: "3.12" }
          - { django: "5.1", python: "3.13" }
          - { django: "5.2", python: "3.10" }
          - { django: "5.2", python: "3.14" }
          - { django: "6.0", python: "3.12" }
          - { django: "6.1", python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          # The release job builds in this workflow, so no shared cache to poison
          enable-cache: false
      - run: uv sync --group dev
      - run: uv pip install "Django~=${{ matrix.django }}.0"
      - run: uv run --no-sync pytest -W error::DeprecationWarning
      - run: uv run --no-sync ruff check .

  without-django:
    # The core must install and run without the django extra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --group dev
      - run: uv pip uninstall django pytest-django
      - run: uv run --no-sync pytest -p no:django -W error::DeprecationWarning
      # The package as the release job would build it, with metadata PyPI accepts
      - run: uv build
      - run: uvx twine==7.0.0 check --strict dist/*

  workflows:
    # actionlint for mistakes, zizmor for security problems in these workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.31.1 --offline --format github .github

  release:
    needs: [test, without-django, workflows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
