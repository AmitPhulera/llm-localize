version: 2
updates:
  # Keeps the pinned action hashes in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  # Keeps uv.lock, the development tools CI runs, up to date
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns: ["*"]
